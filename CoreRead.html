<style>
/* ============================================================
   CoreRead — a self-contained Markdown reader
   One file. No dependencies. No third-party code.
   The only request it ever makes is registering its own service worker,
   same-origin, and only when served over http. See ARCHITECTURE.md.
   ============================================================ */

:root {
  --r-bg:            #ffffff;
  --r-bg-sub:        #f7f8f8;
  --r-bg-sunk:       #f0f2f2;
  --r-border:        #e3e6e6;
  --r-border-strong: #cbd1d1;
  --r-text:          #1b1f1f;
  --r-text-soft:     #5c6666;
  --r-text-faint:    #6a7373;   /* 4.58:1 on the sidebar, 4.87:1 on white — WCAG AA */
  --r-accent:        #C94D28;
  --r-accent-soft:   #FBE2DB;
  --r-warn:          #9a6b18;
  --r-warn-soft:     #fdf6e7;
  --r-code-bg:       #f4f6f6;

  --r-sidebar:  290px;
  --r-toc:      230px;
  --r-measure:  74ch;
  --r-radius:   8px;
  --r-radius-s: 5px;

  --r-font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --r-mono: "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace;
}

[data-theme="dark"] {
  --r-bg:            #14181a;
  --r-bg-sub:        #1a1f21;
  --r-bg-sunk:       #101416;
  --r-border:        #2a3134;
  --r-border-strong: #3c4448;
  --r-text:          #e6eaea;
  --r-text-soft:     #a2adad;
  --r-text-faint:    #7f8888;   /* 4.58:1 on the sidebar, 4.92:1 on the page — WCAG AA */
  --r-accent:        #FF6233;
  --r-accent-soft:   #2B1D18;
  --r-warn:          #e0b45f;
  --r-warn-soft:     #2a2313;
  --r-code-bg:       #1c2225;
}

* { box-sizing: border-box; }

/* The UA rule [hidden]{display:none} loses to any author display rule.
   .welcome and .wrap both set display:grid, so without this they stay
   visible and the welcome screen renders on top of every document. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--r-font);
  background: var(--r-bg);
  color: var(--r-text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---------- shell ---------- */

.app {
  display: grid;
  grid-template-columns: var(--r-sidebar) minmax(0, 1fr);
  grid-template-rows: 46px minmax(0, 1fr);
  grid-template-areas: "brand topbar" "side main";
  height: 100vh;
}

/* Collapsed state keeps a narrow rail. The toggle button lives in this
   column, so collapsing it to 0 would hide the only way back. */
body.no-side .app { grid-template-columns: 46px minmax(0, 1fr); }
body.no-side .brand { padding: 0 8px; justify-content: center; }
body.no-side .sidebar,
body.no-side .brand__mark,
body.no-side .brand__name { display: none; }

/* ---------- brand / titlebar ---------- */

.brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 0 12px;
  background: var(--r-bg-sub);
  border-right: 1px solid var(--r-border);
  border-bottom: 1px solid var(--r-border);
  min-width: 0;
}

/* The same document glyph as the app icon, so the in-app mark and the
   taskbar icon are one thing. A monogram here also failed visually: its
   ink matched the header background almost exactly (1.07:1 in dark),
   so the letters read as holes rather than text. */
.brand__mark {
  width: 20px; height: 20px;
  flex-shrink: 0;
  display: block;
}

.brand__name {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- topbar ---------- */

.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 10px;
  background: var(--r-bg-sub);
  border-bottom: 1px solid var(--r-border);
  min-width: 0;
}

.crumb {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  color: var(--r-text-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-inline: 6px;
}
.crumb b { color: var(--r-text); font-weight: 600; }

.icon-btn {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--r-text-soft);
  width: 30px; height: 30px;
  border-radius: var(--r-radius-s);
  display: grid; place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  font: inherit;
  transition: background .12s, color .12s;
}
.icon-btn:hover:not(:disabled) { background: var(--r-bg-sunk); color: var(--r-text); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn:focus-visible { outline: 2px solid var(--r-accent); outline-offset: 1px; }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- sidebar ---------- */

.sidebar {
  grid-area: side;
  background: var(--r-bg-sub);
  border-right: 1px solid var(--r-border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.search {
  padding: 10px;
  border-bottom: 1px solid var(--r-border);
}
.search input {
  width: 100%;
  font: inherit;
  font-size: 13px;
  padding: 7px 10px;
  border-radius: var(--r-radius-s);
  border: 1px solid var(--r-border-strong);
  background: var(--r-bg);
  color: var(--r-text);
}
.search input:focus { outline: 2px solid var(--r-accent); outline-offset: -1px; border-color: transparent; }
.search input::placeholder { color: var(--r-text-faint); }

.tree {
  flex: 1;
  overflow-y: auto;
  padding: 8px 8px 24px;
}

.tree__group {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--r-text-faint);
  padding: 12px 8px 5px;
}

.tree a {
  display: block;
  padding: 6px 9px;
  border-radius: var(--r-radius-s);
  color: var(--r-text-soft);
  text-decoration: none;
  font-size: 13.2px;
  line-height: 1.35;
  cursor: pointer;
}
.tree a:hover { background: var(--r-bg-sunk); color: var(--r-text); }
.tree a.is-active { background: var(--r-accent); color: #fff; font-weight: 500; }
[data-theme="dark"] .tree a.is-active { color: #14181a; }
.tree a:focus-visible { outline: 2px solid var(--r-accent); outline-offset: -2px; }

.hit { padding: 8px 9px; border-radius: var(--r-radius-s); cursor: pointer; display: block; }
.hit:hover { background: var(--r-bg-sunk); }
.hit__file { font-size: 12px; font-weight: 600; color: var(--r-text); margin-bottom: 2px; }
.hit__snip { font-size: 12px; color: var(--r-text-soft); line-height: 1.45; }
.hit__snip mark { background: var(--r-accent-soft); color: var(--r-text); padding: 0 1px; border-radius: 2px; }

/* ---------- sidebar credit ---------- */

.credit {
  border-top: 1px solid var(--r-border);
  padding: 9px 14px;
  font-size: 11.5px;
  color: var(--r-text-faint);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}
.credit a { color: var(--r-text-soft); text-decoration: none; font-weight: 600; }
.credit a:hover { color: var(--r-accent); text-decoration: underline; }
.credit a:focus-visible { outline: 2px solid var(--r-accent); outline-offset: 2px; border-radius: 3px; }

/* ---------- main ---------- */

.main {
  grid-area: main;
  overflow-y: auto;
  scroll-behavior: smooth;
  position: relative;
}

.wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--r-toc);
  gap: 40px;
  max-width: 1180px;
  margin: 0 auto;
  padding: 44px 44px 30vh;
}
@media (max-width: 1080px) {
  .wrap { grid-template-columns: minmax(0, 1fr); padding: 32px 28px 30vh; }
  .toc { display: none; }
}

.doc { max-width: var(--r-measure); min-width: 0; }

/* ---------- table of contents ---------- */

.toc {
  position: sticky;
  top: 44px;
  align-self: start;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  font-size: 12.5px;
  border-left: 1px solid var(--r-border);
  padding-left: 16px;
}
.toc__title {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--r-text-faint); margin-bottom: 8px;
}
.toc a {
  display: block;
  color: var(--r-text-soft);
  text-decoration: none;
  padding: 3.5px 0;
  line-height: 1.35;
  border-left: 2px solid transparent;
  margin-left: -18px;
  padding-left: 16px;
}
.toc a:hover { color: var(--r-text); }
.toc a.is-current { color: var(--r-accent); border-left-color: var(--r-accent); font-weight: 600; }
.toc a[data-lvl="3"] { padding-left: 28px; font-size: 12px; }

/* ---------- document typography ---------- */

.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
  line-height: 1.25;
  letter-spacing: -.015em;
  scroll-margin-top: 24px;
  position: relative;
}
.doc h1 { font-size: 2.05rem; margin: 0 0 1.4rem; font-weight: 700; }
.doc h2 {
  font-size: 1.42rem; margin: 3rem 0 1rem; font-weight: 650;
  padding-bottom: .45rem; border-bottom: 1px solid var(--r-border);
}
.doc h3 { font-size: 1.12rem; margin: 2.2rem 0 .7rem; font-weight: 650; }
.doc h4 { font-size: .98rem; margin: 1.7rem 0 .5rem; font-weight: 650; color: var(--r-text-soft); }
.doc > :first-child { margin-top: 0; }

.cr-anchor {
  position: absolute;
  left: -.85em;
  color: var(--r-text-faint);
  text-decoration: none;
  opacity: 0;
  font-weight: 400;
  transition: opacity .12s;
}
.doc h2:hover .cr-anchor, .doc h3:hover .cr-anchor { opacity: 1; }

.doc p { margin: 0 0 1.05rem; }
.doc a { color: var(--r-accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.doc a:hover { text-decoration-thickness: 2px; }

.doc ul, .doc ol { margin: 0 0 1.05rem; padding-left: 1.4rem; }
.doc li { margin-bottom: .38rem; }
.doc li > ul, .doc li > ol { margin-top: .38rem; margin-bottom: .3rem; }

.doc hr {
  border: 0;
  border-top: 1px solid var(--r-border);
  margin: 2.4rem 0;
}

.doc img { max-width: 100%; height: auto; border-radius: var(--r-radius); }

.doc strong { font-weight: 650; }

/* ---------- inline code + blocks ---------- */

.doc code {
  font-family: var(--r-mono);
  font-size: .855em;
  background: var(--r-code-bg);
  border: 1px solid var(--r-border);
  padding: .1em .38em;
  border-radius: 4px;
  white-space: nowrap;
}

.cr-code {
  position: relative;
  background: var(--r-code-bg);
  border: 1px solid var(--r-border);
  border-radius: var(--r-radius);
  padding: 14px 16px;
  overflow-x: auto;
  margin: 0 0 1.2rem;
  font-size: 13px;
  line-height: 1.6;
}
.cr-code code {
  background: none; border: 0; padding: 0;
  font-size: inherit; white-space: pre;
}
.cr-code[data-lang]::before {
  content: attr(data-lang);
  position: absolute; top: 0; right: 0;
  font-size: 10px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--r-text-faint);
  padding: 5px 9px;
}
.cr-copy {
  position: absolute; top: 6px; right: 6px;
  font: inherit; font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 4px;
  border: 1px solid var(--r-border-strong);
  background: var(--r-bg); color: var(--r-text-soft);
  cursor: pointer; opacity: 0; transition: opacity .12s;
}
.cr-code:hover .cr-copy, .cr-copy:focus-visible { opacity: 1; }
.cr-copy:hover { color: var(--r-text); }

/* ---------- tables ---------- */

.cr-tablewrap {
  overflow-x: auto;
  margin: 0 0 1.3rem;
  border: 1px solid var(--r-border);
  border-radius: var(--r-radius);
}
.doc table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.doc th, .doc td {
  text-align: left;
  padding: 9px 14px;
  border-bottom: 1px solid var(--r-border);
  vertical-align: top;
}
.doc thead th {
  background: var(--r-bg-sub);
  font-weight: 650;
  font-size: 12.5px;
  white-space: nowrap;
  border-bottom: 1px solid var(--r-border-strong);
}
.doc tbody tr:last-child td { border-bottom: 0; }
.doc tbody tr:hover { background: var(--r-bg-sub); }
.doc td code { white-space: nowrap; }

/* ---------- callouts ---------- */

.cr-note {
  margin: 0 0 1.3rem;
  padding: 12px 16px;
  border-left: 3px solid var(--r-border-strong);
  background: var(--r-bg-sub);
  border-radius: 0 var(--r-radius-s) var(--r-radius-s) 0;
  color: var(--r-text-soft);
}
.cr-note > :last-child { margin-bottom: 0; }
.cr-note--warn { border-left-color: var(--r-warn); background: var(--r-warn-soft); }
.cr-note--ok   { border-left-color: var(--r-accent); background: var(--r-accent-soft); }
.cr-note--warn, .cr-note--ok { color: var(--r-text); }

/* ---------- task lists ---------- */

.cr-tasklist { list-style: none; padding-left: 0; }
.cr-task { display: flex; gap: 10px; align-items: flex-start; }
.cr-task > div { flex: 1; min-width: 0; }
.cr-check {
  margin-top: .3em;
  width: 15px; height: 15px;
  accent-color: var(--r-accent);
  cursor: pointer;
  flex-shrink: 0;
}
.cr-task:has(.cr-check:checked) > div { color: var(--r-text-faint); text-decoration: line-through; }

/* ---------- empty / welcome state ---------- */

.welcome {
  height: 100%;
  display: grid;
  place-items: center;
  padding: 40px;
  text-align: center;
}
.welcome__inner { max-width: 460px; }
.welcome__actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.welcome h1 { font-size: 1.5rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
.welcome p { color: var(--r-text-soft); margin: 0 0 1.5rem; font-size: 14px; }

.btn {
  font: inherit; font-size: 14px; font-weight: 600;
  padding: 10px 20px;
  border-radius: var(--r-radius-s);
  border: 1px solid var(--r-accent);
  background: var(--r-accent);
  color: #fff;
  cursor: pointer;
}
[data-theme="dark"] .btn { color: #14181a; }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--r-accent); outline-offset: 2px; }
/* Must out-specify [data-theme="dark"] .btn (0,2,0), which would otherwise
   paint near-black text on the ghost button in dark mode. */
.btn--ghost,
[data-theme="dark"] .btn--ghost {
  background: transparent;
  color: var(--r-text);
  border-color: var(--r-border-strong);
}
.btn--ghost:hover { background: var(--r-bg-sunk); filter: none; }

.hint {
  margin-top: 18px;
  font-size: 12.5px;
  color: var(--r-text-faint);
  line-height: 1.7;
}
/* Without this, links here fall back to the browser's default blue,
   which is off-brand in light and unreadable in dark. */
.hint a {
  color: var(--r-accent);
  text-decoration: none;
  font-weight: 600;
}
.hint a:hover { text-decoration: underline; }
.hint a:focus-visible { outline: 2px solid var(--r-accent); outline-offset: 2px; border-radius: 3px; }

.hint kbd {
  font-family: var(--r-mono); font-size: 11px;
  border: 1px solid var(--r-border-strong);
  border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px;
  background: var(--r-bg-sub);
}

/* ---------- drop overlay ---------- */

.drop {
  position: fixed; inset: 0;
  background: color-mix(in srgb, var(--r-bg) 88%, transparent);
  backdrop-filter: blur(2px);
  display: none; place-items: center;
  z-index: 90;
  font-size: 15px; font-weight: 600;
}
.drop.is-on { display: grid; }
.drop span {
  border: 2px dashed var(--r-accent);
  border-radius: 12px;
  padding: 40px 60px;
  color: var(--r-accent);
}

/* ---------- scrollbars ---------- */

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--r-border-strong);
  border-radius: 6px;
  border: 3px solid var(--r-bg);
}
.sidebar ::-webkit-scrollbar-thumb { border-color: var(--r-bg-sub); }
::-webkit-scrollbar-thumb:hover { background: var(--r-text-faint); }

/* ---------- print ---------- */

@media print {
  body { overflow: visible; }
  .app { display: block; height: auto; }
  .brand, .topbar, .sidebar, .toc, .cr-copy, .cr-anchor, .credit { display: none !important; }
  .wrap { display: block; max-width: none; padding: 0; }
  .doc { max-width: none; }
  .cr-code, .cr-tablewrap, .cr-note { break-inside: avoid; }
  .doc h2, .doc h3 { break-after: avoid; }
}

/* ---------- narrow screens ----------
   A fixed 290px sidebar crushes the document below ~500px and forces
   horizontal overflow. Under 700px it becomes an overlay above the
   content instead, and starts collapsed. */

@media (max-width: 700px) {
  .app { grid-template-columns: 46px minmax(0, 1fr); }

  .brand { padding: 0 8px; justify-content: center; }
  .brand__mark, .brand__name { display: none; }

  .sidebar {
    position: fixed;
    top: 46px;
    left: 0;
    bottom: 0;
    width: min(290px, 84vw);
    z-index: 60;
    box-shadow: 6px 0 28px rgb(0 0 0 / .18);
  }

  .wrap { padding: 24px 16px 30vh; }
  .doc h1 { font-size: 1.7rem; }
  .doc h2 { font-size: 1.25rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

<script>
"use strict";

/* ============================================================
   1. MARKDOWN PARSER
   Handles: ATX headings, fenced code, GFM tables (+alignment),
   blockquote callouts, nested & ordered lists, task lists,
   thematic breaks, inline code/bold/italic/strike/links/images.
   ============================================================ */

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function slugify(s) {
  return String(s)
    .toLowerCase()
    .replace(/`/g, "")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/[^\p{L}\p{N}\s-]/gu, "")
    .trim()
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-");
}

function isExternal(url) {
  return /^(https?:|mailto:|tel:|ftp:|data:)/i.test(url);
}

function inline(src) {
  // Pull code spans out first so their contents are never re-parsed.
  const spans = [];
  let s = String(src).replace(/(`+)([\s\S]*?)\1/g, (_m, _t, code) => {
    spans.push(code);
    return "\u0000" + (spans.length - 1) + "\u0000";
  });

  s = esc(s);

  // images before links (the ! prefix must win)
  s = s.replace(/!\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\s*\)/g,
    (_m, alt, url, title) =>
      `<img src="${url}" alt="${alt}"${title ? ` title="${title}"` : ""} loading="lazy">`);

  s = s.replace(/\[([^\]]+)\]\(\s*([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\s*\)/g,
    (_m, text, url, title) => {
      const t = title ? ` title="${title}"` : "";
      if (url.startsWith("#")) return `<a href="${url}"${t}>${text}</a>`;
      if (isExternal(url)) return `<a href="${url}" target="_blank" rel="noopener noreferrer"${t}>${text}</a>`;
      return `<a href="#" data-doc="${url}"${t}>${text}</a>`;
    });

  // bare autolinks
  s = s.replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+[^\s<).,;:!?])/g,
    (_m, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);

  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_([^_\n]+)_(?![_\w])/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");

  s = s.replace(/\u0000(\d+)\u0000/g, (_m, i) => `<code>${esc(spans[+i])}</code>`);
  return s;
}

function splitRow(line) {
  let t = line.trim();
  if (t.startsWith("|")) t = t.slice(1);
  if (t.endsWith("|") && !t.endsWith("\\|")) t = t.slice(0, -1);
  const cells = [];
  let cur = "";
  for (let i = 0; i < t.length; i++) {
    if (t[i] === "\\" && t[i + 1] === "|") { cur += "|"; i++; continue; }
    if (t[i] === "|") { cells.push(cur); cur = ""; continue; }
    cur += t[i];
  }
  cells.push(cur);
  return cells;
}

const RX_LIST  = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const RX_HR    = /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/;
const RX_HEAD  = /^(#{1,6})\s+(.*)$/;
const RX_FENCE = /^\s*(`{3,}|~{3,})\s*(\S*)/;
const RX_DELIM = /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;

function isTableDelim(line) {
  return line != null && line.includes("-") && line.includes("|") && RX_DELIM.test(line);
}

function isBlockStart(line, next) {
  return RX_HEAD.test(line) || RX_FENCE.test(line) || RX_HR.test(line) ||
         /^\s*>/.test(line) || RX_LIST.test(line) ||
         (line.includes("|") && isTableDelim(next));
}

function parseList(lines, start, ctx) {
  const first = lines[start].match(RX_LIST);
  const baseIndent = first[1].length;
  const ordered = /\d/.test(first[2]);
  const startNo = ordered ? parseInt(first[2], 10) : 1;
  const items = [];
  let cur = null;
  let i = start;

  while (i < lines.length) {
    const line = lines[i];

    if (line.trim() === "") {
      let j = i;
      while (j < lines.length && lines[j].trim() === "") j++;
      if (j >= lines.length) break;
      const nextIndent = lines[j].match(/^(\s*)/)[1].length;
      const nextIsItem = RX_LIST.test(lines[j]);
      if (nextIndent >= baseIndent + 2 || (nextIsItem && nextIndent >= baseIndent)) {
        if (cur) cur.push("");
        i = j;
        continue;
      }
      break;
    }

    const m = line.match(RX_LIST);
    if (m && m[1].length <= baseIndent + 1) {
      if (m[1].length < baseIndent) break;
      cur = [m[3]];
      items.push(cur);
      i++;
      continue;
    }

    const indent = line.match(/^(\s*)/)[1].length;
    if (cur && indent >= baseIndent + 2) {
      cur.push(line.slice(baseIndent + 2));
      i++;
      continue;
    }
    if (cur && !m && indent > baseIndent) {
      cur.push(line.trim());
      i++;
      continue;
    }
    break;
  }

  let isTaskList = false;
  const body = items.map(it => {
    let text = it.join("\n").replace(/\s+$/, "");
    const tm = text.match(/^\[([ xX])\]\s*([\s\S]*)$/);
    if (tm) {
      isTaskList = true;
      const checked = tm[1].toLowerCase() === "x";
      return `<li class="cr-task"><input type="checkbox" class="cr-check"${checked ? " checked" : ""}><div>${itemBody(tm[2], ctx)}</div></li>`;
    }
    return `<li>${itemBody(text, ctx)}</li>`;
  }).join("");

  const tag = ordered ? "ol" : "ul";
  const attrs = [];
  if (isTaskList) attrs.push('class="cr-tasklist"');
  if (ordered && startNo !== 1) attrs.push(`start="${startNo}"`);
  return { html: `<${tag}${attrs.length ? " " + attrs.join(" ") : ""}>${body}</${tag}>`, i };
}

function itemBody(text, ctx) {
  const lines = text.split("\n");
  const multiline = lines.length > 1;
  const hasBlock = multiline && lines.slice(1).some((l, idx) =>
    isBlockStart(l, lines[idx + 2]) || l.trim() === "");
  if (!hasBlock) return inline(lines.join(" ").trim());
  const rendered = blocks(text, ctx);
  // Unwrap a lone paragraph so simple items stay tight.
  const single = rendered.match(/^<p>([\s\S]*?)<\/p>$/);
  return single ? single[1] : rendered;
}

function blocks(src, ctx) {
  const lines = String(src).replace(/\r\n?/g, "\n").replace(/\t/g, "    ").split("\n");
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // --- fenced code ---
    let m = line.match(RX_FENCE);
    if (m) {
      const fence = m[1][0];
      const len = m[1].length;
      const lang = m[2] || "";
      const buf = [];
      i++;
      while (i < lines.length) {
        const c = lines[i].match(/^\s*(`{3,}|~{3,})\s*$/);
        if (c && c[1][0] === fence && c[1].length >= len) { i++; break; }
        buf.push(lines[i]);
        i++;
      }
      out.push(
        `<pre class="cr-code"${lang ? ` data-lang="${esc(lang)}"` : ""}>` +
        `<code>${esc(buf.join("\n"))}</code>` +
        `<button class="cr-copy" type="button">Copy</button></pre>`
      );
      continue;
    }

    // --- heading ---
    m = line.match(RX_HEAD);
    if (m) {
      const lvl = m[1].length;
      const raw = m[2].replace(/\s*#+\s*$/, "");
      let id = slugify(raw) || "section";
      ctx.slugs[id] = (ctx.slugs[id] || 0) + 1;
      if (ctx.slugs[id] > 1) id += "-" + ctx.slugs[id];
      const html = inline(raw);
      // Only h2 and h3 appear in the contents and reveal a link anchor on
      // hover. Emitting the anchor on other levels would add a node that is
      // permanently invisible, unfocusable and hidden from screen readers.
      const linked = lvl === 2 || lvl === 3;
      if (linked) ctx.toc.push({ lvl, html, id });
      const anchor = linked
        ? `<a class="cr-anchor" href="#${id}" aria-hidden="true" tabindex="-1">#</a>` : "";
      out.push(`<h${lvl} id="${id}">${html}${anchor}</h${lvl}>`);
      i++;
      continue;
    }

    // --- thematic break ---
    if (RX_HR.test(line)) { out.push("<hr>"); i++; continue; }

    // --- table ---
    if (line.includes("|") && isTableDelim(lines[i + 1])) {
      const head = splitRow(line);
      const align = splitRow(lines[i + 1]).map(c => {
        const t = c.trim();
        if (/^:-+:$/.test(t)) return "center";
        if (/^-+:$/.test(t))  return "right";
        return "";
      });
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        rows.push(splitRow(lines[i]));
        i++;
      }
      const st = x => align[x] ? ` style="text-align:${align[x]}"` : "";
      let t = '<div class="cr-tablewrap"><table><thead><tr>';
      head.forEach((c, x) => { t += `<th${st(x)}>${inline(c.trim())}</th>`; });
      t += "</tr></thead><tbody>";
      rows.forEach(r => {
        t += "<tr>";
        for (let x = 0; x < head.length; x++) t += `<td${st(x)}>${inline((r[x] || "").trim())}</td>`;
        t += "</tr>";
      });
      out.push(t + "</tbody></table></div>");
      continue;
    }

    // --- blockquote ---
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, ""));
        i++;
      }
      const text = buf.join("\n");
      let cls = "";
      if (/[⚠❗🚨]|\b(warning|caution|danger|never|don't)\b/i.test(buf[0] || "")) cls = " cr-note--warn";
      else if (/[✅💡ℹ️]|\b(tip|note|why|remember)\b/i.test(buf[0] || "")) cls = " cr-note--ok";
      out.push(`<blockquote class="cr-note${cls}">${blocks(text, ctx)}</blockquote>`);
      continue;
    }

    // --- list ---
    if (RX_LIST.test(line)) {
      const r = parseList(lines, i, ctx);
      out.push(r.html);
      i = r.i;
      continue;
    }

    // --- blank ---
    if (line.trim() === "") { i++; continue; }

    // --- paragraph ---
    const buf = [];
    while (i < lines.length && lines[i].trim() !== "" && !isBlockStart(lines[i], lines[i + 1])) {
      buf.push(lines[i]);
      i++;
    }
    if (buf.length) {
      // two trailing spaces = hard break
      const joined = buf.map((l, n) => n < buf.length - 1 && /\s{2,}$/.test(l) ? l.trim() + "\u0001" : l.trim())
                        .join(" ");
      out.push(`<p>${inline(joined).replace(/\u0001\s?/g, "<br>")}</p>`);
    } else {
      i++;
    }
  }

  return out.join("\n");
}

function renderMarkdown(src) {
  const ctx = { toc: [], slugs: {} };
  // strip YAML front matter
  const clean = String(src).replace(/^---\n[\s\S]*?\n---\n/, "");
  const html = blocks(clean, ctx);
  return { html, toc: ctx.toc };
}

/* ============================================================
   2. APP STATE
   ============================================================ */

const S = {
  files: new Map(),   // relPath -> { path, name, dir, text }
  current: null,
  history: [],
  hIndex: -1,
  root: "",
};

const $ = id => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem("coreread:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("coreread:" + k, JSON.stringify(v)); } catch {} },
};

/* IndexedDB — the only store that can hold a FileSystemDirectoryHandle.
   Every call is guarded: some browsers disable IDB on file:// origins,
   in which case the app silently falls back to picking a folder. */
const IDB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open("coreread", 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", "readwrite");
      t.objectStore("kv").put(v, k);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", "readonly");
      const q = t.objectStore("kv").get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
};

/* ---------- theme ---------- */

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  LS.set("theme", t);
  $("themeIcon").innerHTML = t === "dark"
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
/* Guarded: an unsupported matchMedia would throw here and stop the rest of
   the script from running, leaving every button dead. */
let prefersDark = false;
try { prefersDark = typeof matchMedia === "function"
      && matchMedia("(prefers-color-scheme: dark)").matches; } catch {}
applyTheme(LS.get("theme", prefersDark ? "dark" : "light"));
/* On narrow screens the sidebar overlays the document, so it starts
   collapsed unless the user has explicitly chosen otherwise. */
const NARROW = 700;
if (LS.get("sidebarHidden", window.innerWidth <= NARROW)) document.body.classList.add("no-side");

function loadDemo() {
  S.files.clear();
  for (const [p, text] of Object.entries(DEMO_DOCS)) {
    S.files.set(p, {
      path: p,
      name: p.split("/").pop(),
      dir: p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "",
      text,
    });
  }
  S.root = "CoreRead demo";
  S.dirHandle = null;
  afterLoad();
}

async function loadFromFileList(fileList) {
  const files = [...fileList].filter(f => MD_RX.test(f.name));
  if (!files.length) { alert("No Markdown files found in that folder."); return; }

  S.files.clear();
  let root = "";
  const first = files[0].webkitRelativePath || "";
  if (first.includes("/")) root = first.split("/")[0];

  for (const f of files) {
    const full = f.webkitRelativePath || f.name;
    const rel = root && full.startsWith(root + "/") ? full.slice(root.length + 1) : full;
    const text = await f.text();
    S.files.set(rel, {
      path: rel,
      name: f.name,
      dir: rel.includes("/") ? rel.slice(0, rel.lastIndexOf("/")) : "",
      text,
    });
  }
  S.root = root || files[0].name;
  S.dirHandle = null;   // snapshot load: Reload must re-prompt, not reuse a stale handle
  afterLoad();
}

async function loadFromDirHandle(dh) {
  S.files.clear();
  async function walk(handle, prefix) {
    for await (const [name, h] of handle.entries()) {
      if (name.startsWith(".") || name === "node_modules") continue;
      const p = prefix ? prefix + "/" + name : name;
      if (h.kind === "directory") await walk(h, p);
      else if (MD_RX.test(name)) {
        const f = await h.getFile();
        S.files.set(p, {
          path: p, name,
          dir: p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "",
          text: await f.text(),
        });
      }
    }
  }
  await walk(dh, "");
  if (!S.files.size) { alert("No Markdown files found in that folder."); return; }
  S.root = dh.name;
  S.dirHandle = dh;
  try { await IDB.set("dir", dh); } catch {}   // remember it for next launch
  afterLoad();
}

/* ---------- reopen last folder on launch ----------
   A stored handle keeps its permission grant in most sessions, so this
   usually opens straight into the docs. When the browser downgrades the
   grant to "prompt" it must be re-requested from a user gesture, so we
   show a one-click Reopen button instead of a folder picker.          */

async function tryRestore() {
  let dh;
  try { dh = await IDB.get("dir"); } catch { return false; }
  if (!dh || typeof dh.queryPermission !== "function") return false;

  let perm;
  try { perm = await dh.queryPermission({ mode: "read" }); } catch { return false; }

  if (perm === "granted") {
    try { await loadFromDirHandle(dh); return true; } catch { return false; }
  }
  if (perm === "prompt") { showReopen(dh); return true; }
  return false;
}

function showReopen(dh) {
  const box = document.querySelector(".welcome__inner");
  box.innerHTML =
    '<h1>CoreRead</h1>' +
    '<p>Pick up where you left off.</p>' +
    '<div class="welcome__actions">' +
      '<button class="btn" id="btnReopen">Reopen ' + esc(dh.name) + '</button>' +
      '<button class="btn btn--ghost" id="btnOther">Different folder…</button>' +
    '</div>' +
    '<div class="hint">Your browser asks for folder access once per launch. ' +
    'This is a browser security rule, not a setting.</div>';

  $("btnReopen").addEventListener("click", async () => {
    try {
      if (await dh.requestPermission({ mode: "read" }) === "granted") {
        await loadFromDirHandle(dh);
        return;
      }
    } catch {}
    openFolder();
  });
  $("btnOther").addEventListener("click", openFolder);
}

function afterLoad() {
  $("folderName").textContent = S.root;
  document.title = S.root + " — CoreRead";
  buildTree();
  $("welcome").hidden = true;
  $("wrap").hidden = false;

  const last = LS.get("last:" + S.root, null);
  const target = (last && S.files.has(last)) ? last : pickDefaultDoc();
  S.history = []; S.hIndex = -1;
  openDoc(target);
}

function pickDefaultDoc() {
  const keys = [...S.files.keys()];
  const preferred = keys.find(k => /^(readme|index|start|00)/i.test(k.split("/").pop()));
  return preferred || keys.sort(cmpPath)[0];
}

function cmpPath(a, b) {
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
}

/* ---------- open folder ---------- */

async function openFolder() {
  if (window.showDirectoryPicker) {
    try {
      const dh = await window.showDirectoryPicker({ mode: "read", id: "coreread" });
      await loadFromDirHandle(dh);
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      // fall through to input fallback
    }
  }
  $("dirInput").click();
}

/* ============================================================
   4. SIDEBAR TREE
   ============================================================ */

function buildTree() {
  const tree = $("tree");
  tree.innerHTML = "";
  const byDir = new Map();
  [...S.files.values()].forEach(f => {
    if (!byDir.has(f.dir)) byDir.set(f.dir, []);
    byDir.get(f.dir).push(f);
  });

  [...byDir.keys()].sort(cmpPath).forEach(dir => {
    if (dir) {
      const h = document.createElement("div");
      h.className = "tree__group";
      // strip the sort-order prefix from every segment: "docs/02-setup" -> "docs / setup"
      h.textContent = dir.split("/").map(s => s.replace(/^\d+[-_]/, "")).join(" / ");
      tree.appendChild(h);
    }
    byDir.get(dir).sort((a, b) => cmpPath(a.name, b.name)).forEach(f => {
      const a = document.createElement("a");
      a.tabIndex = 0;
      a.dataset.path = f.path;
      a.textContent = prettyName(f);
      a.addEventListener("click", e => { e.preventDefault(); openDoc(f.path); });
      a.addEventListener("keydown", e => {
        // Enter opens; arrows walk the list so the sidebar is fully keyboard-driven.
        if (e.key === "Enter") { e.preventDefault(); openDoc(f.path); return; }
        if (e.key !== "ArrowDown" && e.key !== "ArrowUp" &&
            e.key !== "Home" && e.key !== "End") return;
        e.preventDefault();
        const items = [...document.querySelectorAll("#tree a")];
        const i = items.indexOf(e.currentTarget);
        const next = e.key === "Home" ? items[0]
                   : e.key === "End"  ? items[items.length - 1]
                   : e.key === "ArrowDown" ? items[Math.min(i + 1, items.length - 1)]
                                           : items[Math.max(i - 1, 0)];
        if (next) { next.focus(); openDoc(next.dataset.path); }
      });
      tree.appendChild(a);
    });
  });
}

function prettyName(f) {
  const h1 = f.text.match(/^#\s+(.+)$/m);
  if (h1) return h1[1].replace(/`/g, "").replace(/\*\*/g, "").trim();
  return f.name.replace(MD_RX, "").replace(/[-_]/g, " ");
}

function markActive() {
  document.querySelectorAll("#tree a").forEach(a =>
    a.classList.toggle("is-active", a.dataset.path === S.current));
}

/* ============================================================
   5. OPENING A DOCUMENT
   ============================================================ */

function openDoc(path, opts = {}) {
  const f = S.files.get(path);
  if (!f) return;

  if (!opts.noHistory) {
    S.history = S.history.slice(0, S.hIndex + 1);
    if (S.history[S.hIndex] !== path) { S.history.push(path); S.hIndex = S.history.length - 1; }
  }
  S.current = path;
  LS.set("last:" + S.root, path);

  // On narrow screens the sidebar covers the document, so close it once a
  // document is chosen. Not persisted — the desktop preference is untouched.
  if (window.innerWidth <= NARROW) document.body.classList.add("no-side");

  const { html, toc } = renderMarkdown(f.text);
  const doc = $("doc");
  doc.innerHTML = html;
  buildToc(toc);
  wireDoc(f);
  markActive();
  updateNav();

  $("crumb").innerHTML = f.dir
    ? esc(f.dir) + " &nbsp;/&nbsp; <b>" + esc(f.name) + "</b>"
    : "<b>" + esc(f.name) + "</b>";

  if (opts.hash) {
    const el = document.getElementById(opts.hash);
    if (el) { el.scrollIntoView(); restoreChecks(); return; }
  }
  // Resume where you stopped reading. Long guides are the whole point of
  // this tool, and jumping back to the top every time is the main friction.
  $("main").scrollTop = LS.get("scroll:" + S.root + ":" + path, 0);
  restoreChecks();
}

/* Remember the reading position, throttled so scrolling stays cheap. */
let scrollSaveTimer = null;
$("main").addEventListener("scroll", () => {
  if (scrollSaveTimer || !S.current) return;
  scrollSaveTimer = setTimeout(() => {
    scrollSaveTimer = null;
    LS.set("scroll:" + S.root + ":" + S.current, Math.round($("main").scrollTop));
  }, 400);
}, { passive: true });

function buildToc(items) {
  const toc = $("toc");
  if (items.length < 2) { toc.innerHTML = ""; return; }
  toc.innerHTML = '<div class="toc__title">On this page</div>' +
    items.map(t => `<a href="#${t.id}" data-lvl="${t.lvl}">${t.html}</a>`).join("");
  toc.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      document.getElementById(a.getAttribute("href").slice(1))?.scrollIntoView();
    });
  });
}

function wireDoc(f) {
  // internal document links
  $("doc").querySelectorAll("a[data-doc]").forEach(a => {
    const raw = decodeURI(a.dataset.doc);
    const [target, hash] = raw.split("#");
    const resolved = resolvePath(f.dir, target);
    if (resolved) {
      a.addEventListener("click", e => { e.preventDefault(); openDoc(resolved, { hash }); });
    } else if (!target && hash) {
      a.addEventListener("click", e => {
        e.preventDefault();
        document.getElementById(hash)?.scrollIntoView();
      });
    } else {
      a.style.opacity = ".55";
      a.title = "Not found in this folder: " + raw;
    }
  });

  // copy buttons
  $("doc").querySelectorAll(".cr-copy").forEach(btn => {
    btn.addEventListener("click", () => {
      const code = btn.parentElement.querySelector("code").textContent;
      navigator.clipboard?.writeText(code).then(() => {
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = "Copy"; }, 1400);
      });
    });
  });

  // task list persistence
  $("doc").querySelectorAll(".cr-check").forEach((cb, idx) => {
    cb.addEventListener("change", () => {
      const key = "checks:" + S.root + ":" + S.current;
      const state = LS.get(key, {});
      state[idx] = cb.checked;
      LS.set(key, state);
    });
  });
}

function restoreChecks() {
  const state = LS.get("checks:" + S.root + ":" + S.current, {});
  $("doc").querySelectorAll(".cr-check").forEach((cb, idx) => {
    if (state[idx] !== undefined) cb.checked = state[idx];
  });
}

function resolvePath(fromDir, target) {
  if (!target) return null;
  let t = target.replace(/^\.\//, "");
  const segs = (fromDir ? fromDir.split("/") : []);
  t.split("/").forEach(part => {
    if (part === "..") segs.pop();
    else if (part !== "." && part !== "") segs.push(part);
  });
  const joined = segs.join("/");
  if (S.files.has(joined)) return joined;
  // tolerate a missing/odd extension or a bare filename
  const base = joined.replace(MD_RX, "");
  for (const key of S.files.keys()) {
    if (key.replace(MD_RX, "") === base) return key;
  }
  const leaf = target.split("/").pop().replace(MD_RX, "").toLowerCase();
  for (const key of S.files.keys()) {
    if (key.split("/").pop().replace(MD_RX, "").toLowerCase() === leaf) return key;
  }
  return null;
}

/* ---------- history ---------- */

function updateNav() {
  $("btnBack").disabled = S.hIndex <= 0;
  $("btnFwd").disabled  = S.hIndex >= S.history.length - 1;
}
function go(delta) {
  const n = S.hIndex + delta;
  if (n < 0 || n >= S.history.length) return;
  S.hIndex = n;
  openDoc(S.history[n], { noHistory: true });
}

/* ============================================================
   6. SEARCH
   ============================================================ */

function runSearch(term) {
  const tree = $("tree");
  if (!term.trim()) { buildTree(); markActive(); return; }
  const needle = term.toLowerCase();
  const hits = [];

  for (const f of S.files.values()) {
    const hay = f.text.toLowerCase();
    let from = 0, count = 0;
    while (count < 3) {
      const at = hay.indexOf(needle, from);
      if (at === -1) break;
      const s = Math.max(0, at - 45), e = Math.min(f.text.length, at + needle.length + 55);
      const before = esc(f.text.slice(s, at)).replace(/\n/g, " ");
      const mid    = esc(f.text.slice(at, at + needle.length));
      const after  = esc(f.text.slice(at + needle.length, e)).replace(/\n/g, " ");
      hits.push({
        path: f.path,
        file: prettyName(f),
        snip: (s > 0 ? "…" : "") + before + "<mark>" + mid + "</mark>" + after + (e < f.text.length ? "…" : ""),
      });
      from = at + needle.length;
      count++;
    }
  }

  tree.innerHTML = "";
  if (!hits.length) {
    tree.innerHTML = '<div class="tree__group">No matches</div>';
    return;
  }
  const head = document.createElement("div");
  head.className = "tree__group";
  head.textContent = hits.length + " match" + (hits.length === 1 ? "" : "es");
  tree.appendChild(head);

  hits.forEach(h => {
    const d = document.createElement("div");
    d.className = "hit";
    d.tabIndex = 0;
    d.innerHTML = `<div class="hit__file">${esc(h.file)}</div><div class="hit__snip">${h.snip}</div>`;
    const open = () => openDoc(h.path);
    d.addEventListener("click", open);
    d.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
    tree.appendChild(d);
  });
}

/* ============================================================
   7. TOC SCROLL SPY
   ============================================================ */

let spyTimer = null;
$("main").addEventListener("scroll", () => {
  if (spyTimer) return;
  spyTimer = setTimeout(() => {
    spyTimer = null;
    const links = [...document.querySelectorAll("#toc a")];
    if (!links.length) return;
    const top = $("main").scrollTop + 90;
    let active = links[0];
    for (const a of links) {
      const el = document.getElementById(a.getAttribute("href").slice(1));
      if (el && el.offsetTop <= top) active = a;
    }
    links.forEach(a => a.classList.toggle("is-current", a === active));
  }, 90);
}, { passive: true });

/* ============================================================
   8. EVENTS
   ============================================================ */

$("btnOpen").addEventListener("click", openFolder);
$("btnOpen2").addEventListener("click", openFolder);
$("btnDemo").addEventListener("click", loadDemo);
$("btnBack").addEventListener("click", () => go(-1));
$("btnFwd").addEventListener("click", () => go(1));
$("btnPrint").addEventListener("click", () => window.print());

$("btnReload").addEventListener("click", async () => {
  if (S.dirHandle) {
    const keep = S.current;
    await loadFromDirHandle(S.dirHandle);
    if (S.files.has(keep)) openDoc(keep);
  } else {
    openFolder();
  }
});

$("btnTheme").addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

$("btnSide").addEventListener("click", () => {
  const hidden = document.body.classList.toggle("no-side");
  LS.set("sidebarHidden", hidden);
});

$("dirInput").addEventListener("change", e => {
  if (e.target.files.length) loadFromFileList(e.target.files);
  e.target.value = "";
});
$("fileInput").addEventListener("change", e => {
  if (e.target.files.length) loadFromFileList(e.target.files);
  e.target.value = "";
});

/* Arrow down out of the search box and into the document list. */
$("q").addEventListener("keydown", e => {
  if (e.key !== "ArrowDown") return;
  const first = document.querySelector("#tree a, #tree .hit");
  if (first) { e.preventDefault(); first.focus(); }
});

let qTimer = null;
$("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  const v = e.target.value;
  qTimer = setTimeout(() => runSearch(v), 130);
});

/* ---------- keyboard ---------- */

document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "o") { e.preventDefault(); openFolder(); }
  else if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); document.body.classList.remove("no-side"); LS.set("sidebarHidden", false); $("q").focus(); $("q").select(); }
  else if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); $("btnSide").click(); }
  else if (mod && e.key.toLowerCase() === "j") { e.preventDefault(); $("btnTheme").click(); }
  else if (e.key === "F5") { e.preventDefault(); $("btnReload").click(); }
  else if (e.altKey && e.key === "ArrowLeft")  { e.preventDefault(); go(-1); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "Escape" && document.activeElement === $("q")) {
    $("q").value = ""; runSearch(""); $("q").blur();
  }
});

/* ---------- drag & drop ---------- */

let dragDepth = 0;
const dropEl = $("drop");

addEventListener("dragenter", e => { e.preventDefault(); if (++dragDepth === 1) dropEl.classList.add("is-on"); });
addEventListener("dragover",  e => { e.preventDefault(); });
addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove("is-on"); } });

addEventListener("drop", async e => {
  e.preventDefault();
  dragDepth = 0;
  dropEl.classList.remove("is-on");

  const items = [...(e.dataTransfer.items || [])];

  // Prefer a real directory handle when the browser offers one.
  for (const it of items) {
    if (it.kind !== "file") continue;
    if (it.getAsFileSystemHandle) {
      try {
        const h = await it.getAsFileSystemHandle();
        if (h && h.kind === "directory") { await loadFromDirHandle(h); return; }
      } catch {}
    }
  }

  // Fall back to the legacy entry API (walks dropped folders).
  const entries = items.map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  const dir = entries.find(en => en.isDirectory);
  if (dir) {
    const collected = [];
    await walkEntry(dir, "", collected);
    if (collected.length) {
      S.files.clear();
      const strip = dir.name + "/";
      collected.forEach(c => {
        if (c.path.startsWith(strip)) {
          c.path = c.path.slice(strip.length);
          c.dir = c.path.includes("/") ? c.path.slice(0, c.path.lastIndexOf("/")) : "";
        }
        S.files.set(c.path, c);
      });
      S.root = dir.name;
      S.dirHandle = null;
      afterLoad();
      return;
    }
  }

  // Single file(s).
  const files = [...(e.dataTransfer.files || [])].filter(f => MD_RX.test(f.name));
  if (files.length) {
    S.files.clear();
    for (const f of files) {
      S.files.set(f.name, { path: f.name, name: f.name, dir: "", text: await f.text() });
    }
    S.root = files.length === 1 ? files[0].name : "Dropped files";
    S.dirHandle = null;
    afterLoad();
  }
});

function walkEntry(entry, prefix, out) {
  return new Promise(resolve => {
    if (entry.isFile) {
      if (!MD_RX.test(entry.name)) return resolve();
      entry.file(async f => {
        const p = prefix ? prefix + "/" + entry.name : entry.name;
        out.push({ path: p, name: entry.name, dir: prefix, text: await f.text() });
        resolve();
      }, resolve);
      return;
    }
    const reader = entry.createReader();
    const all = [];
    const readBatch = () => reader.readEntries(async batch => {
      if (!batch.length) {
        for (const en of all) {
          if (en.name.startsWith(".")) continue;
          await walkEntry(en, prefix ? prefix + "/" + entry.name : entry.name, out);
        }
        return resolve();
      }
      all.push(...batch);
      readBatch();
    }, resolve);
    readBatch();
  });
}

/* ============================================================
   9. STARTUP
   ============================================================ */

/* Offline support for the hosted version.
   A service worker cannot be inlined — it must be a separate same-origin
   file — so it would break the single-file rule if it lived in the repo.
   Instead the Pages workflow generates sw.js at deploy time, and this
   registration silently does nothing when the app is opened from disk,
   where there is no origin and no service worker to register. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

/* #demo in the URL opens the built-in sample straight away, so the
   hosted version can be linked to as a working demo.               */
if (location.hash.toLowerCase() === "#demo") {
  loadDemo();
} else {
  tryRestore().catch(() => {});
}
