name: Deploy demo to GitHub Pages

# Publishes CoreRead.html as the site root, so the live demo is at
#   https://<user>.github.io/coreread/        (empty state)
#   https://<user>.github.io/coreread/#demo   (built-in sample docs)
#
# Also generates a service worker here rather than committing one. A service
# worker must be a separate same-origin file, so keeping it in the repo would
# break the single-file rule. Generating it at deploy time gives the installed
# app real offline support while the downloadable file stays one file.
#
# One-time setup: repo Settings -> Pages -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "CoreRead.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Stage site
        run: |
          mkdir -p _site
          cp CoreRead.html _site/index.html

          # Cache-first service worker. The app is a single file with no
          # external requests, so caching the shell is the whole job.
          # The version string busts the cache whenever the app changes.
          VERSION=$(grep -oE 'CoreRead v[0-9]+\.[0-9]+\.[0-9]+' CoreRead.html | head -1 | sed -E 's/.*v//')
          HASH=$(sha256sum CoreRead.html | cut -c1-12)
          echo "cache key -> coreread-${VERSION}-${HASH}"
          cat > _site/sw.js <<SW
          const CACHE = "coreread-${VERSION}-${HASH}";
          const SHELL = ["./", "./index.html"];

          self.addEventListener("install", e => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)).then(() => self.skipWaiting()));
          });

          self.addEventListener("activate", e => {
            e.waitUntil(
              caches.keys()
                .then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });

          // Cache first, then network. Nothing here is dynamic, so a stale
          // hit is always correct until the next deploy changes CACHE.
          self.addEventListener("fetch", e => {
            if (e.request.method !== "GET") return;
            e.respondWith(
              caches.match(e.request).then(hit =>
                hit || fetch(e.request).then(res => {
                  if (res && res.ok && res.type === "basic") {
                    const copy = res.clone();
                    caches.open(CACHE).then(c => c.put(e.request, copy));
                  }
                  return res;
                }).catch(() => caches.match("./index.html"))
              )
            );
          });
          SW

          echo "--- staged ---"
          ls -la _site/
          node --check _site/sw.js && echo "sw.js parses"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
